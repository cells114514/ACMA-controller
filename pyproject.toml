[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acma-controller"
version = "0.3.0"
description = "Model-independent Windows VM control interface and durable execution service"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ACMA contributors"}]
dependencies = []
classifiers = ["Development Status :: 3 - Alpha", "Operating System :: Microsoft :: Windows", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
imaging = ["Pillow>=10.4,<13"]

[project.urls]
Repository = "https://github.com/cells114514/ACMA-controller"

[project.scripts]
acma-controller = "acma_controller.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
acma_controller = ["scripts/*.ps1", "scripts/*.cs"]
